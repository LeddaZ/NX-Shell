name: C/C++ CI

on:
  push:
    branches: [ next-opengl3 ]
  pull_request:
    branches: [ next-opengl3 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: devkitpro/devkita64:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Build
      run: make

    - uses: actions/upload-artifact@v7
      with:
        name: NX-Shell.nro
        path: NX-Shell.nro
